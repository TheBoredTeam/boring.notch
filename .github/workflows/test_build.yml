name: "Test Build (unsigned)"

# Builds an ad-hoc signed copy of the app that can be downloaded from the run's
# Artifacts section and tried locally, without Apple developer certificates.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Boring Notch (ad-hoc signed)
    runs-on: macos-latest
    env:
      PROJECT_NAME: boringNotch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select newest Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "::error::No Xcode 26 found on this runner"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT_NAME.xcodeproj"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$PROJECT_NAME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Zip app
        run: |
          APP_PATH="$(find build/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)"
          echo "Built: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" BoringNotch-test.zip

      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BoringNotch-test
          path: BoringNotch-test.zip
