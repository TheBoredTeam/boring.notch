name: Build for macOS

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

# https://stackoverflow.com/a/72408109/6942800
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege: only needs to read code for building.
permissions:
  contents: read

jobs:
  build:
    name: Build Boring Notch (${{ matrix.xcode }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: "~26.0"
          - os: macos-26
            xcode: "^26"
          - os: xcode-27
            xcode: "^27"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        uses: mxcl/xcodebuild@d3ee9b419c1be9a988086c58fe0988f32d99cfc5 # v3.6.0
        with:
          xcode: ${{ matrix.xcode }}
          platform: macOS
          scheme: boringNotch
          action: build
          verbosity: xcpretty
          upload-logs: always
          configuration: release

      # Unit tests run hosted by the app (TEST_HOST), so they spawn a real
      # menubar-app instance on the runner — acceptable on CI where nothing
      # else reacts to it; they are skipped on matrix legs without hosted-test
      # support if they ever become flaky there.
      - name: Test
        uses: mxcl/xcodebuild@d3ee9b419c1be9a988086c58fe0988f32d99cfc5 # v3.6.0
        with:
          xcode: ${{ matrix.xcode }}
          platform: macOS
          scheme: boringNotch
          action: test
          verbosity: xcpretty
          upload-logs: always
          configuration: debug
