name: "Reusable Build"
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: false
        type: string
      build_number:
        required: true
        type: string
      xcode_version:
        required: false
        type: string
        default: "26.6"
      code_sign_identity:
        required: false
        type: string
        default: "Apple Development"
      update_channel:
        required: false
        type: string
        default: "stable"
      # "development" exports an Apple Development build (unchanged behavior).
      # "developer-id" re-signs the export with a Developer ID Application
      # certificate, then notarizes and staples both the .app and the DMG.
      distribution:
        required: false
        type: string
        default: "development"
    secrets:
      BUILD_CERTIFICATE_BASE64:
        required: true
      P12_PASSWORD:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      # Only needed when distribution is "developer-id".
      DEVELOPER_ID_CERTIFICATE_BASE64:
        required: false
      DEVELOPER_ID_P12_PASSWORD:
        required: false
      NOTARY_API_KEY_BASE64:
        required: false
      NOTARY_API_KEY_ID:
        required: false
      NOTARY_API_ISSUER_ID:
        required: false

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      PROJECT_NAME: boringNotch
      APP_NAME: Boring Notch
      DISTRIBUTION: ${{ inputs.distribution }}
      DEVELOPER_ID_IDENTITY: Developer ID Application
      VERSION_INPUT: ${{ inputs.version }}
      BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
      UPDATE_CHANNEL: ${{ inputs.update_channel }}
      DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM_ID }}
      CODE_SIGN_IDENTITY: ${{ inputs.code_sign_identity }}
      XCODE_VERSION: ${{ inputs.xcode_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Validate distribution settings
        env:
          HAS_DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 != '' }}
          HAS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD != '' }}
          HAS_NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY_BASE64 != '' }}
          HAS_NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID != '' }}
          HAS_NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID != '' }}
        run: |
          set -euo pipefail
          case "$DISTRIBUTION" in
            development) exit 0 ;;
            developer-id) ;;
            *) echo "::error::Unknown distribution '$DISTRIBUTION' (expected development or developer-id)"; exit 1 ;;
          esac
          MISSING=()
          [[ "$HAS_DEVELOPER_ID_CERTIFICATE" == "true" ]] || MISSING+=(DEVELOPER_ID_CERTIFICATE_BASE64)
          [[ "$HAS_DEVELOPER_ID_P12_PASSWORD" == "true" ]] || MISSING+=(DEVELOPER_ID_P12_PASSWORD)
          [[ "$HAS_NOTARY_API_KEY" == "true" ]] || MISSING+=(NOTARY_API_KEY_BASE64)
          [[ "$HAS_NOTARY_API_KEY_ID" == "true" ]] || MISSING+=(NOTARY_API_KEY_ID)
          [[ "$HAS_NOTARY_API_ISSUER_ID" == "true" ]] || MISSING+=(NOTARY_API_ISSUER_ID)
          [[ -n "$DEVELOPMENT_TEAM" ]] || MISSING+=("vars.DEVELOPMENT_TEAM_ID")
          if (( ${#MISSING[@]} > 0 )); then
            echo "::error::developer-id distribution needs: ${MISSING[*]}"
            exit 1
          fi

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT_NAME.xcodeproj"

      - name: Install Apple certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KC="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security list-keychain -d user -s "$KC"

      - name: Install Developer ID certificate and notary key
        if: ${{ inputs.distribution == 'developer-id' }}
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          CERT_PATH="$RUNNER_TEMP/developer_id_certificate.p12"
          KC="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$CERT_PATH"
          if ! security find-identity -v -p codesigning "$KC" | grep -q "$DEVELOPER_ID_IDENTITY"; then
            echo "::error::No '$DEVELOPER_ID_IDENTITY' identity found after importing DEVELOPER_ID_CERTIFICATE_BASE64"
            exit 1
          fi
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary_api_key.p8"
          echo -n "$NOTARY_API_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Xcode ${XCODE_VERSION} not found at ${XCODE_PATH}"
            echo "Available Xcode versions:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none found)"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Set version and build number
        run: |
          set -euo pipefail
          PBXPROJ="$PROJECT_NAME.xcodeproj/project.pbxproj"
          VERSION="$VERSION_INPUT"
          if [[ -z "$BUILD_NUMBER_INPUT" ]]; then
            echo "::error::A reserved build number must be provided by the caller"
            exit 1
          fi
          BUILD_NUMBER="$BUILD_NUMBER_INPUT"
          python3 .github/scripts/stamp_version.py \
            --pbxproj "$PBXPROJ" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --info-plist "$PROJECT_NAME/Info.plist" \
            --update-channel "$UPDATE_CHANNEL"

      # The adapter test client is a prebuilt, ad-hoc signed executable shipped
      # as a resource. The Developer ID export re-signs it but keeps its
      # (empty) code signing flags, so it would lack the hardened runtime and
      # fail notarization. Sign it with the hardened runtime up front.
      - name: Sign bundled helper executables for Developer ID
        if: ${{ inputs.distribution == 'developer-id' }}
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp \
            --sign "$DEVELOPER_ID_IDENTITY" \
            mediaremote-adapter/MediaRemoteAdapterTestClient

      - name: Build and archive
        run: |
          xcodebuild clean archive \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$PROJECT_NAME" \
            -archivePath "$PROJECT_NAME" \
            -destination "generic/platform=macOS" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            ONLY_ACTIVE_ARCH=NO \
            -allowProvisioningUpdates

      - name: Export app
        run: |
          if [[ "$DISTRIBUTION" == "developer-id" ]]; then
            SIGNING_OPTIONS="<key>method</key>
            <string>developer-id</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>${DEVELOPER_ID_IDENTITY}</string>"
          else
            SIGNING_OPTIONS="<key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>"
          fi
          cat > "$RUNNER_TEMP/export_options.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            ${SIGNING_OPTIONS}
            <key>teamID</key>
            <string>${DEVELOPMENT_TEAM}</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/export_options.plist"
          xcodebuild -exportArchive \
            -archivePath "$PROJECT_NAME.xcarchive" \
            -exportPath Release \
            -exportOptionsPlist "$RUNNER_TEMP/export_options.plist"

      - name: Verify Developer ID signature
        if: ${{ inputs.distribution == 'developer-id' }}
        run: |
          set -euo pipefail
          APP="Release/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Notarization requires Developer ID and a secure timestamp on every
          # Mach-O in the bundle, plus the hardened runtime on executables.
          FAILED=0
          while IFS= read -r -d '' BIN; do
            KIND="$(file -b "$BIN")"
            [[ "$KIND" == *Mach-O* ]] || continue
            INFO="$(codesign -dvv "$BIN" 2>&1 || true)"
            if ! grep -q "Authority=$DEVELOPER_ID_IDENTITY" <<<"$INFO" \
              || ! grep -q "^Timestamp=" <<<"$INFO"; then
              echo "::error::${BIN#Release/} is not signed with Developer ID and a secure timestamp"
              FAILED=1
            elif [[ "$KIND" == *executable* ]] && ! grep -Eq "flags=.*runtime" <<<"$INFO"; then
              echo "::error::${BIN#Release/} is missing the hardened runtime"
              FAILED=1
            fi
          done < <(find "$APP" -type f -print0)
          exit "$FAILED"

      - name: Notarize and staple app
        if: ${{ inputs.distribution == 'developer-id' }}
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          .github/scripts/notarize.sh "Release/$APP_NAME.app"
          spctl --assess --type execute --verbose=4 "Release/$APP_NAME.app"

      - name: Create DMG
        run: |
          VENV_DIR="$RUNNER_TEMP/venv"
          python3 -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --require-hashes -r Configuration/dmg/requirements.txt
          chmod +x Configuration/dmg/create_dmg.sh
          ./Configuration/dmg/create_dmg.sh \
            "Release/$APP_NAME.app" \
            "Release/$APP_NAME.dmg" \
            "$APP_NAME $VERSION_INPUT"

      - name: Sign, notarize and staple DMG
        if: ${{ inputs.distribution == 'developer-id' }}
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="Release/$APP_NAME.dmg"
          codesign --force --timestamp --sign "$DEVELOPER_ID_IDENTITY" "$DMG"
          .github/scripts/notarize.sh "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APP_NAME }}.dmg
          path: Release/${{ env.APP_NAME }}.dmg

      - name: Upload .app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APP_NAME }}.app
          path: Release/${{ env.APP_NAME }}.app
