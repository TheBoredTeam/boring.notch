name: "Deploy Boring Notch"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 2.8.0 or 2.8.0-rc.1)"
        required: true
        type: string

concurrency:
  group: dev-publication
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  pull-requests: read

env:
  PROJECT_NAME: boringNotch
  BETA_CHANNEL_NAME: beta

jobs:
  preparation:
    name: Preparation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      is_beta: ${{ steps.extract_version.outputs.is_beta }}
      title: ${{ steps.release_notes.outputs.title }}
      release_notes: ${{ steps.release_notes.outputs.release_notes }}
      release_notes_github: ${{ steps.release_notes.outputs.release_notes_github }}
      pr_number: ${{ steps.release_state.outputs.pr_number }}
      source_sha: ${{ steps.release_state.outputs.source_sha }}
      resume: ${{ steps.release_state.outputs.resume }}
      build_number: ${{ steps.release_state.outputs.resume == 'false' && steps.build_number.outputs.build_number || '' }}
    steps:
      - name: Require protected release workflow
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "::error::Run releases from the protected main workflow, not ${WORKFLOW_REF}"
            exit 1
          fi

      - name: Authorize release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          PERM=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.permission')
          if [[ "$PERM" != "admin" ]]; then
            echo "::error::${ACTOR} is not an admin (permission: ${PERM})"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Extract requested version
        id: extract_version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          OUTPUT=$(python3 .github/scripts/extract_version.py -c "$VERSION_INPUT")
          VERSION=$(awk -F= '/^version=/{print $2; exit}' <<<"$OUTPUT")
          IS_BETA=$(awk -F= '/^is_beta=/{print $2; exit}' <<<"$OUTPUT")
          if [[ -z "$VERSION" || ( "$VERSION_INPUT" != "$VERSION" && "$VERSION_INPUT" != "v$VERSION" ) ]]; then
            echo "::error::Version must be a complete semantic version, optionally prefixed with v"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "is_beta=$IS_BETA"
          } >> "$GITHUB_OUTPUT"

      - name: Determine release state
        id: release_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          set -euo pipefail
          OWNER="${REPO%%/*}"
          TAG="v${VERSION}"
          LOOKUP_ERROR="$RUNNER_TEMP/release-lookup-error"

          # A published release for this version means the workflow already ran
          # to completion; re-running it is not a recovery path.
          # Draft releases are invisible to the /releases/tags REST endpoint
          # (it 404s for drafts even with write access), so the probe goes
          # through gh release view, which resolves drafts via the list API.
          if RELEASE_JSON="$(gh release view "$TAG" --repo "$REPO" --json isDraft,targetCommitish 2>"$LOOKUP_ERROR")"; then
            IS_DRAFT="$(jq -r '.isDraft' <<< "$RELEASE_JSON")"
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "::error::Version v${VERSION} is already published"
              exit 1
            fi
            SOURCE_SHA="$(jq -r '.targetCommitish' <<< "$RELEASE_JSON")"
            if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Draft release for v${VERSION} has an invalid target commit"
              exit 1
            fi
            {
              echo "resume=true"
              echo "source_sha=$SOURCE_SHA"
              echo "pr_number="
            } >> "$GITHUB_OUTPUT"
            echo "Resuming release v${VERSION} from draft target ${SOURCE_SHA}."
            exit 0
          fi

          if ! grep -q 'release not found' "$LOOKUP_ERROR"; then
            cat "$LOOKUP_ERROR" >&2
            echo "::error::Could not determine whether v${VERSION} already exists"
            exit 1
          fi

          # Fresh release: exactly one open same-repository dev-to-main PR is
          # the reviewed source of truth. Its head is the build source.
          # gh api switches to POST when parameters are supplied, which is not
          # the list operation; pin the method to GET explicitly.
          PR_CANDIDATES=$(gh api -X GET "repos/${REPO}/pulls" \
            -f state=open -f base=main -f head="${OWNER}:dev" -f per_page=5 \
            --jq '[.[].number]')
          PR_COUNT="$(jq length <<< "$PR_CANDIDATES")"
          if [[ "$PR_COUNT" != "1" ]]; then
            echo "::error::Expected exactly one open dev-to-main release PR, found ${PR_COUNT}"
            exit 1
          fi
          PR_NUMBER=$(jq -r '.[0]' <<< "$PR_CANDIDATES")
          PR_DATA=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" \
            --jq '{head_ref: .head.ref, head_sha: .head.sha, base_ref: .base.ref, head_repo: .head.repo.full_name, base_repo: .base.repo.full_name, is_draft: .draft, mergeable: .mergeable}')
          HEAD_REF=$(echo "$PR_DATA" | jq -r '.head_ref')
          HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head_sha')
          BASE_REF=$(echo "$PR_DATA" | jq -r '.base_ref')
          HEAD_REPO=$(echo "$PR_DATA" | jq -r '.head_repo')
          BASE_REPO=$(echo "$PR_DATA" | jq -r '.base_repo')
          IS_DRAFT=$(echo "$PR_DATA" | jq -r '.is_draft')
          MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable')

          if [[ "$HEAD_REPO" != "$REPO" || "$BASE_REPO" != "$REPO" || "$HEAD_REF" != "dev" || "$BASE_REF" != "main" || \
                ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Release PR must be a same-repository dev-to-main PR with an immutable head SHA"
            exit 1
          fi
          if [[ "$IS_DRAFT" == "true" || "$MERGEABLE" != "true" ]]; then
            echo "::error::PR #${PR_NUMBER} is not ready to merge (draft=${IS_DRAFT}, mergeable=${MERGEABLE})"
            exit 1
          fi
          {
            echo "resume=false"
            echo "source_sha=$HEAD_SHA"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Derive build number
        id: build_number
        if: steps.release_state.outputs.resume == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.release_state.outputs.source_sha }}
          VERSION: ${{ steps.extract_version.outputs.version }}
          PBXPROJ_PATH: ${{ env.PROJECT_NAME }}.xcodeproj/project.pbxproj
          APPCAST_PATHS: "updater/appcast-dev.xml updater/appcast.xml"
        run: |
          set -euo pipefail
          # Same derivation as the nightly pipeline: one above the highest
          # version already released through Sparkle, floored by the number
          # committed in the Xcode project. Stable and beta items live in the
          # main-branch appcast while nightly items live in the dev appcast,
          # so the ceiling is the max across both and every channel outranks
          # the last release on any channel. Both appcasts are readable from
          # the built source ref; a missing/unreadable file contributes
          # nothing, and if nothing is readable at all the derivation falls
          # back to the project baseline.
          RELEASED="$(for APPCAST in ${APPCAST_PATHS}; do
            gh api "repos/${REPO}/contents/${APPCAST}?ref=${SOURCE_SHA}" \
              --jq '.content' 2>/dev/null | base64 --decode \
              | grep -Eo 'sparkle:version(="|>)[0-9]+' | grep -Eo '[0-9]+$'
          done | sort -n | tail -1 || true)"
          PBXPROJ="$RUNNER_TEMP/project.pbxproj"
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${REPO}/contents/${PBXPROJ_PATH}?ref=${SOURCE_SHA}" > "$PBXPROJ"
          BASE_BUILD="$(grep -Eo 'CURRENT_PROJECT_VERSION = [0-9]+' "$PBXPROJ" \
            | grep -Eo '[0-9]+$' | sort -n | tail -1)"
          BASE_BUILD="${BASE_BUILD:-0}"
          BUILD_NUMBER="$(( RELEASED > BASE_BUILD ? RELEASED + 1 : BASE_BUILD + 1 ))"
          echo "v${VERSION} -> build ${BUILD_NUMBER} (appcast: ${RELEASED:-none}, project: ${BASE_BUILD})"

          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.release_state.outputs.pr_number }}
          VERSION: ${{ steps.extract_version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_NUMBER" ]]; then
            TITLE=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.title // "Release"')
            BODY=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // "- No release notes provided"')
          else
            # The resume path must read a draft release, which the
            # /releases/tags endpoint cannot see; gh release view can.
            TITLE=$(gh release view "v${VERSION}" --repo "$REPO" --json name --jq '.name // "Release"')
            BODY=$(gh release view "v${VERSION}" --repo "$REPO" --json body --jq '.body // "- No release notes provided"')
          fi

          BODY_GITHUB=$(printf '%s' "$BODY" | sed '/^# /d' | perl -pe 's#<h1[^>]*>.*?</h1>##gi')

          TITLE_DELIM="TITLE_$(uuidgen | tr -d '-')"
          NOTES_DELIM="RELEASE_NOTES_$(uuidgen | tr -d '-')"
          GH_NOTES_DELIM="RELEASE_NOTES_GH_$(uuidgen | tr -d '-')"
          {
            echo "title<<${TITLE_DELIM}"
            printf '%s\n' "$TITLE"
            echo "${TITLE_DELIM}"
            echo "release_notes<<${NOTES_DELIM}"
            printf '%s\n' "$BODY"
            echo "${NOTES_DELIM}"
            echo "release_notes_github<<${GH_NOTES_DELIM}"
            printf '%s\n' "$BODY_GITHUB"
            echo "${GH_NOTES_DELIM}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and sign
    if: ${{ needs.preparation.outputs.resume == 'false' }}
    needs: preparation
    permissions:
      contents: read
    uses: ./.github/workflows/build_reusable.yml
    with:
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      version: ${{ needs.preparation.outputs.version }}
      build_number: ${{ needs.preparation.outputs.build_number }}
      update_channel: ${{ needs.preparation.outputs.is_beta == 'true' && 'beta' || 'stable' }}
    secrets:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

  publish:
    name: Publish draft release and appcast
    needs: [preparation, build]
    if: ${{ !cancelled() && needs.preparation.result == 'success' && (needs.preparation.outputs.resume == 'true' || needs.build.result == 'success') }}
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preparation.outputs.version }}
      IS_BETA: ${{ needs.preparation.outputs.is_beta }}
      SOURCE_SHA: ${{ needs.preparation.outputs.source_sha }}
      RESUME: ${{ needs.preparation.outputs.resume }}
      TITLE: ${{ needs.preparation.outputs.title }}
      NOTES: ${{ needs.preparation.outputs.release_notes_github }}
      RELEASE_NOTES: ${{ needs.preparation.outputs.release_notes }}
    steps:
      - name: Create release app token
        id: release_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: boring.notch
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Download release artifact
        if: ${{ needs.preparation.outputs.resume == 'true' }}
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
        run: |
          set -euo pipefail
          gh release download "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$PROJECT_NAME.dmg" \
            --dir Release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.preparation.outputs.resume == 'false' }}
        with:
          name: ${{ env.PROJECT_NAME }}.dmg
          path: Release

      - name: Create embedded release notes
        run: printf '%s' "$RELEASE_NOTES" > Release/boringNotch.html

      - name: Fetch Sparkle generate_appcast
        uses: ./.github/actions/fetch-generate-appcast

      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.PRIVATE_SPARKLE_KEY }}
        run: |
          set -euo pipefail
          test -x "$RUNNER_TEMP/generate_appcast" || {
            echo "::error::$RUNNER_TEMP/generate_appcast missing or not executable"; exit 1;
          }
          if [[ "$IS_BETA" == "true" ]]; then
            APPCAST_OUT="appcast-beta.xml"
            CHANNEL_ARGS=(--channel "$BETA_CHANNEL_NAME")
          else
            APPCAST_OUT="appcast-stable.xml"
            CHANNEL_ARGS=()
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/generate_appcast" \
            --ed-key-file - \
            --link "https://github.com/TheBoredTeam/boring.notch/releases" \
            --download-url-prefix "https://github.com/TheBoredTeam/boring.notch/releases/download/v${VERSION}/" \
            --embed-release-notes \
            "${CHANNEL_ARGS[@]}" \
            -o "$APPCAST_OUT" \
            Release/

      - name: Upload generated appcast
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appcast-${{ env.IS_BETA }}
          path: appcast-*.xml

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if [[ "$RESUME" == "true" ]]; then
            echo "Resumed existing draft release ${TAG}."
            exit 0
          fi
          RELEASE_FLAGS=(--draft)
          if [[ "$IS_BETA" == "true" ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" "Release/$PROJECT_NAME.dmg" \
            --target "$SOURCE_SHA" \
            --title "${TAG} - ${TITLE}" \
            --notes "$NOTES" \
            "${RELEASE_FLAGS[@]}"
          echo "Created draft release ${TAG} targeting ${SOURCE_SHA}."

  merge_release:
    name: Merge release PR
    if: ${{ needs.preparation.outputs.is_beta == 'false' && needs.publish.result == 'success' }}
    needs: [preparation, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create release app token
        id: release_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: boring.notch
          permission-contents: write

      - name: Merge release PR
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.preparation.outputs.source_sha }}
        run: |
          set -euo pipefail
          OWNER="${REPO%%/*}"
          # gh api switches to POST when parameters are supplied, which is not
          # the list operation; pin the method to GET explicitly.
          PR_LIST=$(gh api -X GET "repos/${REPO}/pulls" \
            -f state=open -f base=main -f head="${OWNER}:dev" -f per_page=5 \
            --jq '[.[].number]')
          PR_COUNT="$(jq length <<< "$PR_LIST")"
          if [[ "$PR_COUNT" -gt 1 ]]; then
            echo "::error::Expected at most one open dev-to-main release PR"
            exit 1
          fi
          if [[ "$PR_COUNT" == "1" ]]; then
            PR_NUMBER="$(jq -r '.[0]' <<< "$PR_LIST")"
            HEAD_SHA="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            if [[ "$HEAD_SHA" != "$SOURCE_SHA" ]]; then
              echo "::error::PR head moved to ${HEAD_SHA}; rebuild before merging"
              exit 1
            fi
            gh pr merge "$PR_NUMBER" --repo "$REPO" --merge --match-head-commit "$SOURCE_SHA"
            echo "Merged release PR #${PR_NUMBER}."
          else
            echo "No open release PR; assuming it was merged in a previous run."
          fi

          MAIN_SHA="$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          MAIN_RELATION="$(gh api "repos/${REPO}/compare/${SOURCE_SHA}...${MAIN_SHA}" --jq '.status')"
          if [[ "$MAIN_RELATION" != "ahead" && "$MAIN_RELATION" != "identical" ]]; then
            echo "::error::Release source ${SOURCE_SHA} is not contained in main"
            exit 1
          fi
          echo "Verified release source ${SOURCE_SHA} is contained in main."

  publish_stable:
    name: Publish stable release
    if: ${{ needs.preparation.outputs.is_beta == 'false' && needs.publish.result == 'success' && needs.merge_release.result == 'success' }}
    needs: [preparation, publish, merge_release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preparation.outputs.version }}
    steps:
      - name: Create release app token
        id: release_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: boring.notch
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.release_app_token.outputs.token }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appcast-false
          path: .

      - name: Commit appcast to main
        env:
          RELEASE_APP_TOKEN: ${{ steps.release_app_token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp appcast-stable.xml updater/appcast.xml
          git add updater/appcast.xml
          if git diff --cached --quiet; then
            echo "Appcast already up to date; nothing to commit."
            exit 0
          fi
          git commit -m "Update appcast for v${VERSION}"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RELEASE_APP_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="$AUTH_HEADER" push origin main

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          # Draft releases are invisible to the /releases/tags REST endpoint
          # (it 404s for drafts even with write access); probe with
          # gh release view instead.
          if ! IS_DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "::error::Release ${TAG} does not exist; expected the draft created by the publish job"
            exit 1
          fi
          if [[ "$IS_DRAFT" != "true" ]]; then
            echo "Stable release ${TAG} is already published."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh release edit "$TAG" --draft=false; then
              echo "Published stable release ${TAG}."
              exit 0
            fi
            echo "Stable release publication failed; retrying (${attempt}/5)"
            sleep $((attempt * 2))
          done
          echo "::error::Could not publish stable ${VERSION} after 5 attempts"
          exit 1

  publish_beta:
    name: Publish beta release
    if: ${{ needs.preparation.outputs.is_beta == 'true' && needs.publish.result == 'success' }}
    needs: [preparation, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preparation.outputs.version }}
    steps:
      - name: Create release app token
        id: release_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: boring.notch
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.release_app_token.outputs.token }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appcast-true
          path: .

      - name: Merge beta appcast into main
        env:
          RELEASE_APP_TOKEN: ${{ steps.release_app_token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/merge_appcast_channel.py \
            updater/appcast.xml \
            appcast-beta.xml \
            "$BETA_CHANNEL_NAME"
          git add updater/appcast.xml
          if git diff --cached --quiet; then
            echo "Published appcast already contains v${VERSION}."
            exit 0
          fi
          git commit -m "Update appcast with beta release for v${VERSION}"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RELEASE_APP_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="$AUTH_HEADER" push origin main

      - name: Publish beta release
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          # Draft releases are invisible to the /releases/tags REST endpoint
          # (it 404s for drafts even with write access); probe with
          # gh release view instead.
          if ! IS_DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "::error::Release ${TAG} does not exist; expected the draft created by the publish job"
            exit 1
          fi
          if [[ "$IS_DRAFT" != "true" ]]; then
            echo "Beta release ${TAG} is already published."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh release edit "$TAG" --draft=false; then
              echo "Published beta release ${TAG}."
              exit 0
            fi
            echo "Beta release publication failed; retrying (${attempt}/5)"
            sleep $((attempt * 2))
          done
          echo "::error::Could not publish beta ${VERSION} after 5 attempts"
          exit 1

  upgrade-brew:
    name: Update Homebrew cask
    if: ${{ always() && needs.preparation.result == 'success' && ((needs.preparation.outputs.is_beta == 'true' && needs.publish_beta.result == 'success') || (needs.preparation.outputs.is_beta == 'false' && needs.publish_stable.result == 'success')) }}
    needs: [preparation, publish, publish_beta, publish_stable]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preparation.outputs.version }}
      IS_BETA: ${{ needs.preparation.outputs.is_beta }}
    steps:
      - name: Generate cask files
        run: |
          set -euo pipefail
          DMG_URL="https://github.com/TheBoredTeam/boring.notch/releases/download/v${VERSION}/boringNotch.dmg"

          # Retry SHA calculation (release may need a moment to propagate)
          for attempt in 1 2 3; do
            if SHA256=$(curl -sL --fail "$DMG_URL" | shasum -a 256 | cut -d' ' -f1); then break; fi
            echo "Attempt $attempt failed, retrying in 10s..."; sleep 10
          done
          [[ -n "${SHA256:-}" ]] || { echo "::error::Failed to download DMG for SHA256"; exit 1; }

          write_cask() {
            local CASK_NAME="$1" DISPLAY_NAME="$2" DESC="$3"
            cat <<CASK
          cask "${CASK_NAME}" do
            version "${VERSION}"
            sha256 "${SHA256}"
            url "${DMG_URL}"
            name "${DISPLAY_NAME}"
            desc "${DESC}"
            homepage "https://github.com/TheBoredTeam/boring.notch"
            livecheck do
              url :url
              strategy :github_latest
            end
            auto_updates true
            depends_on macos: :sonoma
            app "boringNotch.app"

            postflight do
              app_path = appdir/"boringNotch.app"
              next unless app_path.exist?
              system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", app_path]
            end

            uninstall quit: "theboringteam.boringnotch"

            zap trash: [
              "~/Library/Application Scripts/theboringteam.boringnotch/",
              "~/Library/Containers/theboringteam.boringnotch/",
            ]
          end
          CASK
          }

          write_cask "boring-notch@rc" "Boring Notch RC" \
            "Not so boring notch That Rocks (Release Candidate)" > boring-notch@rc.rb
          if [[ "${IS_BETA}" == "false" ]]; then
            write_cask "boring-notch" "Boring Notch" \
              "Not so boring notch That Rocks" > boring-notch.rb
          fi

      - name: Upload cask artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-cask-${{ env.VERSION }}
          path: boring-notch*.rb

      - name: Create Homebrew tap app token
        id: tap_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: homebrew-boring-notch
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TheBoredTeam/homebrew-boring-notch
          path: homebrew-tap
          persist-credentials: false

      - name: Update casks in tap
        id: update_casks
        run: |
          set -euo pipefail
          cp boring-notch@rc.rb homebrew-tap/Casks/boring-notch@rc.rb
          COMMIT_MSG="Update boring-notch@rc to v${VERSION}"
          if [[ "${IS_BETA}" == "false" ]]; then
            cp boring-notch.rb homebrew-tap/Casks/boring-notch.rb
            COMMIT_MSG="Update boring-notch and boring-notch@rc to v${VERSION}"
          fi
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "casks_changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "$COMMIT_MSG"
            echo "casks_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push casks to tap
        if: steps.update_casks.outputs.casks_changed == 'true'
        env:
          TAP_APP_TOKEN: ${{ steps.tap_app_token.outputs.token }}
        run: |
          set -euo pipefail
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_APP_TOKEN" | base64 | tr -d '\n')"
          cd homebrew-tap
          git -c http.extraheader="$AUTH_HEADER" push origin "HEAD:refs/heads/$(git symbolic-ref --short HEAD)"

  ending:
    name: Finalize
    if: ${{ always() && needs.preparation.result != 'skipped' }}
    needs: [preparation, build, publish, merge_release, publish_stable, publish_beta, upgrade-brew]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ALL_RESULTS: ${{ join(needs.*.result, ',') }}
      RELEASE_SUCCEEDED: ${{ !contains(join(needs.*.result, ','), 'failure') && !contains(join(needs.*.result, ','), 'cancelled') }}
      IS_BETA: ${{ needs.preparation.outputs.is_beta }}
      VERSION: ${{ needs.preparation.outputs.version }}
      BUILD_NUMBER: ${{ needs.preparation.outputs.build_number }}
    steps:
      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${IS_BETA}" == "true" ]]; then
            BUILD_TYPE="beta"
          else
            BUILD_TYPE="stable"
          fi
          {
            if [[ "${RELEASE_SUCCEEDED}" == "true" ]]; then
              echo "✅ Released boringNotch v${VERSION} (${BUILD_TYPE} build ${BUILD_NUMBER})"
              echo "🍺 Homebrew cask updated"
              echo "📱 Sparkle appcast updated"
            else
              echo "❌ Release failed${VERSION:+ for boringNotch v${VERSION}}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"