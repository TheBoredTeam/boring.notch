<?xml version="1.0" encoding="UTF-8"?>
<!--
  Custom Notched Display Symbol - MacBook Pro 14" Proportion
  
  Geometry reference:
    viewBox: 0 0 1000 765
    outer border weight: 24
    inner screen below notch: 800 x 500 (Exactly 16:10)
    total inner screen: 800 x 537
    screen corner radius: 24
    
  Notch reference (MacBook Pro 14" Physical Proportions):
    notch depth: 37 (from y=114 down to y=151)
    notch width: 214 (centered between x=393 and x=607)
    top bezel fillet radius: 10 (~1/3 of depth)
    bottom notch corner radius: 16 (~1/2 of depth)
    vertical side drop: 11 units
-->
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="1000"
     height="765"
     viewBox="0 0 1000 765"
     fill="none">

  <!-- Filled display frame + integrated notch.
       Uses even-odd fill so the interior screen remains transparent. -->
  <path fill="currentColor" fill-rule="evenodd"
        d="
        M 124 90
        H 876
        A 48 48 0 0 1 924 138
        V 627
        A 48 48 0 0 1 876 675
        H 124
        A 48 48 0 0 1 76 627
        V 138
        A 48 48 0 0 1 124 90
        Z

        M 124 114
        H 383
        A 10 10 0 0 1 393 124
        V 135
        A 16 16 0 0 0 409 151
        H 591
        A 16 16 0 0 0 607 135
        V 124
        A 10 10 0 0 1 617 114
        H 876
        A 24 24 0 0 1 900 138
        V 627
        A 24 24 0 0 1 876 651
        H 124
        A 24 24 0 0 1 100 627
        V 138
        A 24 24 0 0 1 124 114
        Z
        "/>
</svg>
