<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Soft neutral capsule</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent: #7c6cff; --fg: #f6f6f8; --muted: #929298; }
    body { min-height: 100vh; display: grid; place-items: center; background: #161618; color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    .stage { width: min(760px, calc(100vw - 32px)); }
    .picker { display: flex; gap: 6px; margin: 0 auto 18px; width: max-content; padding: 4px; border-radius: 12px; background: #242427; }
    .picker button { border: 0; color: #aaaab0; background: transparent; padding: 7px 13px; border-radius: 9px; cursor: pointer; }
    .picker button.active { color: white; background: #3a3a3f; }
    .notch { min-height: 254px; padding: 21px 24px 22px; border-radius: 25px; background: #060607; box-shadow: 0 24px 60px #0009, inset 0 0 0 1px #ffffff0a; }
    header { display: flex; align-items: center; gap: 10px; }
    .sun { color: #ff9f43; font-size: 20px; }
    .heading h1 { font-size: 17px; line-height: 1.1; letter-spacing: -.2px; }
    .heading p { margin-top: 3px; font-size: 11px; color: var(--muted); }
    .primary { margin-left: auto; display: flex; align-items: center; gap: 8px; height: 31px; padding: 0 11px 0 12px; border: 1px solid #ffffff16; border-radius: 999px; background: #ffffff0d; box-shadow: inset 0 1px #ffffff0d; color: #e7e7eb; font-size: 11px; font-weight: 650; cursor: pointer; transition: .2s ease; }
    .primary .mark { display: grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: #ffffff0d; color: #bdbdc3; transition: .2s ease; }
    .primary:hover { border-color: #ffffff28; background: #ffffff16; transform: translateY(-1px); }
    .primary:hover .mark { background: var(--accent); color: white; transform: translateX(1px); }
    .primary:active { transform: translateY(0) scale(.97); }
    .primary.done { border-color: #7c6cff55; background: #7c6cff18; }
    .primary.done .mark { background: var(--accent); color: white; }
    .columns { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 18px; margin-top: 24px; }
    .divider { background: #ffffff14; }
    .section-title { color: #adadb3; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; margin-bottom: 12px; }
    .todo { display: flex; align-items: center; gap: 9px; min-height: 29px; color: #ededf0; font-size: 13px; }
    .check { width: 17px; height: 17px; border: 1.5px solid #77777e; border-radius: 50%; background: transparent; cursor: pointer; color: transparent; transition: .18s ease; }
    .check.on { border-color: var(--accent); color: var(--accent); }
    .todo.done span { color: #77777e; text-decoration: line-through; }
    .note { text-align: center; margin-top: 14px; color: #717178; font-size: 11px; }
  </style>
</head>
<body>
  <main class="stage">
    <nav class="picker" aria-label="Preview mode"><button class="active" data-mode="morning">Morning</button><button data-mode="evening">Evening</button></nav>
    <section class="notch">
      <header>
        <div class="sun" id="symbol">☀︎</div>
        <div class="heading"><h1 id="title">Today’s Plan</h1><p>Aug 9, 2026</p></div>
        <button class="primary" id="action"><span id="actionText">Start My Day</span><span class="mark">→</span></button>
      </header>
      <div class="columns">
        <div><div class="section-title">Still open · 2</div><div class="todo"><button class="check">✓</button><span>Review operating systems notes</span></div><div class="todo"><button class="check">✓</button><span>Submit tutorial exercises</span></div></div>
        <div class="divider"></div>
        <div><div class="section-title">Completed · 2</div><div class="todo done"><button class="check on">✓</button><span>Read database chapter</span></div><div class="todo done"><button class="check on">✓</button><span>Plan tomorrow’s lab</span></div></div>
      </div>
    </section>
    <p class="note">Hover and click the header action. Switch modes to compare both labels.</p>
  </main>
  <script>
    const action = document.querySelector('#action'); const actionText = document.querySelector('#actionText'); let mode = 'morning';
    document.querySelectorAll('.picker button').forEach(button => button.addEventListener('click', () => { mode = button.dataset.mode; document.querySelectorAll('.picker button').forEach(item => item.classList.toggle('active', item === button)); document.querySelector('#title').textContent = mode === 'morning' ? 'Today’s Plan' : 'Evening Review'; document.querySelector('#symbol').textContent = mode === 'morning' ? '☀︎' : '☾'; actionText.textContent = mode === 'morning' ? 'Start My Day' : 'Wrap Up My Day'; action.querySelector('.mark').textContent = '→'; action.classList.remove('done'); }));
    action.addEventListener('click', () => { actionText.textContent = mode === 'morning' ? 'Day Started' : 'Day Wrapped Up'; action.querySelector('.mark').textContent = '✓'; action.classList.add('done'); });
    document.querySelectorAll('.check').forEach(check => check.addEventListener('click', () => { check.classList.toggle('on'); check.closest('.todo').classList.toggle('done'); }));
  </script>
</body>
</html>
